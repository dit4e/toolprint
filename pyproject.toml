[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolprint"
version = "0.1.0"
description = "Offline, no-account MCP assessment: context cost, capability risk, and definition drift"
requires-python = ">=3.9"
dependencies = []          # core is stdlib-only; this is a load-bearing claim, not an accident

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"] # optional accuracy upgrade only; never auto-installed

[project.scripts]
toolprint = "toolprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolprint = ["viewer/*.html", "vendor/*.py"]
