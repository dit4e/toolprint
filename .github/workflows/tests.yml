name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: PYTHONPATH=src:. python -m unittest discover -s tests -t . -v
      - name: The collection kit must stay under 425 lines and stdlib-only
        run: |
          LINES=$(wc -l < src/toolprint/vendor/mcp_collect.py)
          echo "mcp_collect.py: $LINES lines"
          test "$LINES" -lt 425
